
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Informes (v3.4 - EMG Mejorado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .report-output h3 { font-size: 1.25rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #111827; border-bottom: 2px solid #3b82f6; padding-bottom: 0.5rem; letter-spacing: 0.5px; }
        .report-output h4 { font-size: 1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #374151; }
        .report-output p { margin-bottom: 1rem; line-height: 1.65; }
        .report-output .signature { margin-bottom: 0.25rem; line-height: 1.4; }
        .report-output .legal { font-size: 0.8rem; color: #6b7280; font-style: italic; margin-top: 1.5rem; }
        #toast { transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
